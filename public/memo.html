<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梧桐居</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.memo-page{max-width:760px;margin:0 auto;padding:6.5rem 1.25rem 4rem}
.memo-head{text-align:center;margin-bottom:2rem}
.memo-head h1{font-family:var(--serif);font-size:2rem;margin-bottom:.4rem}
.memo-head p{color:var(--ink-soft)}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.8rem;box-shadow:0 8px 30px rgba(60,50,30,.05)}
.field{margin-bottom:1.4rem}
.field label{display:block;font-weight:500;margin-bottom:.5rem;font-size:.95rem}
.field .hint{color:#a89f91;font-size:.8rem;font-weight:400;margin-left:.4rem}
.input, .wysiwyg{
  width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:.85rem 1rem;font-family:var(--sans);font-size:1rem;color:var(--ink);
  background:#fdfcfa;transition:.2s;
}
.input:focus,.wysiwyg:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,161,95,.15)}
.wysiwyg{min-height:260px;resize:vertical;line-height:1.8}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.toolbar button{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:.4rem .8rem;cursor:pointer;font-size:.9rem;color:var(--ink-soft);
}
.toolbar button:hover{border-color:var(--accent);color:var(--accent-dark)}
.toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.photo-zone{
  border:2px dashed var(--line);border-radius:12px;padding:1.4rem;text-align:center;
  color:var(--ink-soft);cursor:pointer;transition:.2s;margin-bottom:1rem;
}
.photo-zone:hover{border-color:var(--accent);color:var(--accent-dark)}
.photo-zone input{display:none}
.photo-previews{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
.photo-previews .ph{position:relative}
.photo-previews img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photo-previews .x{
  position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:#c0392b;color:#fff;border:none;cursor:pointer;font-size:.8rem;line-height:22px;text-align:center;
}
.submit-row{display:flex;align-items:center;gap:1rem}
.btn-submit{
  flex:1;border:none;cursor:pointer;font-size:1.05rem;letter-spacing:.12em;
  padding:1rem;border-radius:10px;color:#fff;font-family:var(--sans);
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.back-link{display:inline-block;margin-top:1.5rem;color:var(--accent-dark);font-size:.9rem}
.uploading{color:var(--accent-dark);font-size:.9rem}
</style>
</head>
<body data-page="memo">

<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="/">梧桐居</a>
    <nav class="topnav-links">
      <a href="/#about">生平简介</a>
      <a href="/#timeline">时间线</a>
      <a href="/#memorywall">思念之墙</a>
      <a href="/#gallery">相册</a>
      <a class="topnav-cta" href="/memo">写下思念</a>
    </nav>
  </div>
</header>

<main class="memo-page">
  <div class="memo-head">
    <h1>留下思念</h1>
    <p>请写下留言</p>
  </div>

  <form class="editor" id="memoForm" onsubmit="return false;">
    <div class="field">
      <label>您的称呼</label>
      <input class="input" id="memoName" placeholder="可选，例如：一位朋友" maxlength="50">
    </div>

    <div class="field">
      <label>思念寄语 <span class="hint">支持富文本编辑</span></label>
      <div class="toolbar">
        <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
        <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
        <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
        <button type="button" data-cmd="insertUnorderedList" title="列表">☰ 列表</button>
        <button type="button" data-cmd="formatBlock" data-val="blockquote" title="引用">❝ 引用</button>
      </div>
      <div class="wysiwyg" id="memoText" contenteditable="true" placeholder="写下您想说的话……"></div>
    </div>

    <div class="field">
      <label>上传照片 <span class="hint">可选，最多 5 张</span></label>
      <div class="photo-zone" id="photoZone">
        <div>📷 点击选择照片</div>
        <input type="file" id="photoInput" accept="image/*" multiple>
      </div>
      <div class="photo-previews" id="photoPreviews"></div>
      <div class="uploading" id="uploadingMsg"></div>
    </div>

    <div class="submit-row">
      <button class="btn-submit" id="submitBtn">上传</button>
    </div>
    <a class="back-link" href="/">← 返回纪念主页</a>
  </form>
</main>

<footer class="site-footer">
  <div>梧桐居</div>
  <!-- <div class="pow">Powered by Memorial</div> -->
</footer>

<div class="overlay" id="doneOverlay">
  <div class="popup">
    <div class="ico">💌</div>
    <h3>内容已收到</h3>
    <p>您的思念已成功提交，正在处理中。感谢您的留言。</p>
    <button onclick="location.href='/'">返回首页</button>
  </div>
</div>

<script src="/js/memo.js"></script>
</body>
</html>
